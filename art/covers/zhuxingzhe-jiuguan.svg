<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
<title>火星穹顶下的一只鸡尾酒杯，杯中酒液托着一颗带环的小行星，四圈轨道绕杯而行，象征酒馆见证的四个时代</title>
<defs>
<pattern id="zhuxingzhe-jiuguan-dots" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="4" cy="4" r="1.7" fill="#0078BF"/></pattern>
<pattern id="zhuxingzhe-jiuguan-dots-s" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="3" cy="3" r="1.1" fill="#0078BF"/></pattern>
<filter id="zhuxingzhe-jiuguan-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.118 0 0 0 0 0.129 0 0 0 0 0.251 0 0 0 -2.2 1.4"/></filter>
<clipPath id="zhuxingzhe-jiuguan-planet"><circle cx="420" cy="178" r="104"/></clipPath>
<clipPath id="zhuxingzhe-jiuguan-dome"><path d="M80 560A220 220 0 0 1 520 560Z"/></clipPath>
</defs>
<rect width="600" height="800" fill="#EEEFEA"/>
