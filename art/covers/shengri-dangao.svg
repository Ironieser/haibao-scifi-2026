<filter id="shengri-dangao-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.118 0 0 0 0 0.129 0 0 0 0 0.251 0 0 0 -2.2 1.4"/></filter>
<clipPath id="shengri-dangao-low"><path d="M170 450H430V556A130 26 0 0 1 170 556Z"/></clipPath>
<clipPath id="shengri-dangao-up"><path d="M216 378H384V444A84 17 0 0 1 216 444Z"/></clipPath>
</defs>
<rect width="600" height="800" fill="#EEEFEA"/>
