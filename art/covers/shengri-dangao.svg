<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
<title>一只两层的生日蛋糕上，唯一的蜡烛刚被吹灭，一缕轻烟升起并连成北斗七星，银河两岸是牛郎星与织女星</title>
<defs>
