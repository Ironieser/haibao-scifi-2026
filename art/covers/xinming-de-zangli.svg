<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
<title>一条心电图般的信号线在最后一次跳动后化为地平线，黄色的黎明从这条平线上升起，夜空中留着一颗不灭的光点</title>
<defs>
<pattern id="xinming-de-zangli-dots-b" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="4" cy="4" r="1.8" fill="#0078BF"/></pattern>
<pattern id="xinming-de-zangli-dots-y" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3.5" cy="3.5" r="1.6" fill="#FFE800"/></pattern>
<filter id="xinming-de-zangli-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.118 0 0 0 0 0.129 0 0 0 0 0.251 0 0 0 -2.2 1.4"/></filter>
<linearGradient id="xinming-de-zangli-fade" gradientUnits="userSpaceOnUse" x1="0" y1="84" x2="0" y2="380"><stop offset="0" stop-color="#0078BF" stop-opacity="0.95"/><stop offset="0.55" stop-color="#0078BF" stop-opacity="0.75"/><stop offset="1" stop-color="#0078BF" stop-opacity="0"/></linearGradient>
<clipPath id="xinming-de-zangli-skyhole"><path clip-rule="evenodd" d="M0 0H600V470H0ZM272 146A28 28 0 1 0 328 146A28 28 0 1 0 272 146Z"/></clipPath>
<clipPath id="xinming-de-zangli-band"><rect x="0" y="200" width="600" height="130"/></clipPath>
<clipPath id="xinming-de-zangli-sky"><rect x="0" y="0" width="600" height="470"/></clipPath>
<clipPath id="xinming-de-zangli-disk"><circle cx="300" cy="320" r="236"/></clipPath>
<clipPath id="xinming-de-zangli-sea"><rect x="0" y="470" width="600" height="160"/></clipPath>
</defs>
<rect width="600" height="800" fill="#EEEFEA"/>
<!-- 蓝版：夜空圆盘 + 水面倒影 -->
<g style="mix-blend-mode:multiply">
<g clip-path="url(#xinming-de-zangli-skyhole)">
<circle cx="300" cy="320" r="236" fill="url(#xinming-de-zangli-fade)"/>
</g>
<g transform="translate(-4 3)" clip-path="url(#xinming-de-zangli-band)"><circle cx="300" cy="320" r="236" fill="url(#xinming-de-zangli-dots-b)" opacity="0.8"/></g>
<path d="M64 320A236 236 0 0 0 536 320" fill="none" stroke="#0078BF" stroke-width="3" opacity="0.6"/>
<g transform="translate(-4 3)">
<g clip-path="url(#xinming-de-zangli-sea)">
<circle cx="300" cy="320" r="236" fill="url(#xinming-de-zangli-dots-b)"/>
</g>
<g fill="#0078BF" opacity="0.6">
<rect x="150" y="490" width="300" height="5"/><rect x="190" y="512" width="220" height="4"/><rect x="230" y="532" width="140" height="3"/>
</g>
</g>
</g>
<!-- 黄版：升起的太阳 + 光芒网点 -->
<g style="mix-blend-mode:multiply" transform="translate(3 -2)">
<g clip-path="url(#xinming-de-zangli-sky)">
<circle cx="300" cy="470" r="250" fill="url(#xinming-de-zangli-dots-y)" clip-path="url(#xinming-de-zangli-disk)"/>
<circle cx="300" cy="470" r="128" fill="#FFE800"/>
</g>
<g fill="none" stroke="#FFE800" stroke-width="10">
<path d="M144 470A156 156 0 0 1 456 470" opacity="0.8"/>
<path d="M118 470A182 182 0 0 1 482 470" opacity="0.55"/>
</g>
<g clip-path="url(#xinming-de-zangli-sea)" fill="#FFE800">
<rect x="236" y="486" width="128" height="8"/><rect x="256" y="506" width="88" height="6"/><rect x="276" y="524" width="48" height="5"/>
</g>
<circle cx="300" cy="146" r="11" fill="#FFE800"/>
</g>
<!-- 墨版：心跳线化作地平线 + 光点 -->
<g style="mix-blend-mode:multiply" fill="none" stroke="#1E2140" stroke-linecap="round" stroke-linejoin="round">
<path d="M48 470H96L106 458 116 470H130L140 482 156 380 172 500 184 462 194 470H552" stroke-width="3"/>
<circle cx="300" cy="146" r="20" stroke-width="1.6"/>
<path d="M300 112V124M300 168V180M266 146H278M322 146H334" stroke-width="1.6"/>
</g>
<g fill="#1E2140">
<circle cx="552" cy="470" r="5"/>
<circle cx="214" cy="226" r="2"/><circle cx="398" cy="196" r="2"/><circle cx="452" cy="300" r="1.6"/><circle cx="160" cy="320" r="1.6"/><circle cx="360" cy="110" r="1.6"/>
</g>
<rect width="600" height="800" filter="url(#xinming-de-zangli-grain)" opacity="0.12"/>
</svg>
